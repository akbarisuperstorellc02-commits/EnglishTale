name: Generate Episode 001 British English Audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/tts/**"
      - "episodes/001-english-at-the-airport/voice-manifest.json"
      - "project-settings.json"
      - ".github/workflows/generate-english-audio.yml"

permissions:
  contents: read

jobs:
  generate-english-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/tts/local-requirements.txt
      - name: Install local Piper TTS runtime
        run: python -m pip install -r tools/tts/local-requirements.txt
      - name: Download and verify pinned British English multi-speaker model
        run: python tools/tts/download_british_voice.py
      - name: Verify Piper CLI and model files
        run: |
          piper --help
          test -s models/piper/en_GB-vctk-medium/en_GB-vctk-medium.onnx
          test -s models/piper/en_GB-vctk-medium/en_GB-vctk-medium.onnx.json
          test -s models/piper/en_GB-vctk-medium/ATTRIBUTION.txt
      - name: Generate all 48 British English character and narrator cues
        run: |
          python tools/tts/generate_local_english.py \
            --model models/piper/en_GB-vctk-medium/en_GB-vctk-medium.onnx \
            --voices-json tools/tts/episode-001-voices.json
      - name: Strictly validate all English WAV clips
        run: python tools/tts/validate_voice_assets.py --strict
      - name: Assemble the 7-minute English master WAV
        run: python tools/tts/build_english_track.py
      - name: Retiming English and Afghan Dari subtitles from measured cue WAVs
        run: python tools/tts/retime_subtitles.py
      - name: Validate final audio and subtitle package
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import wave
          from pathlib import Path

          clips = sorted(Path("build/audio/episode-001/en").glob("*.wav"))
          assert len(clips) == 48, f"Expected 48 English cue WAVs, found {len(clips)}"
          master = Path("build/audio/episode-001-en.wav")
          with wave.open(str(master), "rb") as wav:
              assert wav.getnchannels() == 1
              assert wav.getsampwidth() == 2
              assert wav.getnframes() / wav.getframerate() == 420
          for subtitle in (
              Path("build/subtitles/episode-001-en-retimed.srt"),
              Path("build/subtitles/episode-001-fa-retimed.srt"),
          ):
              assert subtitle.is_file() and subtitle.stat().st_size > 1000
              assert len(subtitle.read_text(encoding="utf-8").strip().split("\n\n")) == 48
          print(f"PASS: {len(clips)} English cue WAVs")
          print(f"PASS: 420-second master WAV ({master.stat().st_size:,} bytes)")
          print("PASS: 48-cue English and Afghan Dari subtitle files")
          PY
      - name: Install FFmpeg and scene-render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg blender libegl1 libgl1 libxrender1 libxi6
          python -m pip install -r tools/video-pipeline/requirements.txt
      - name: Render complete 7-minute 720p review cut with English audio and selectable subtitles
        run: |
          python tools/video-pipeline/render_episode.py \
            --output build/episode-001-review-720p.mp4 \
            --width 1280 --height 720 --fps 24 \
            --english-audio build/audio/episode-001-en.wav \
            --subtitles-en build/subtitles/episode-001-en-retimed.srt \
            --subtitles-fa build/subtitles/episode-001-fa-retimed.srt
      - name: Validate complete review MP4
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          video = Path("build/episode-001-review-720p.mp4")
          assert video.is_file() and video.stat().st_size > 2_000_000, "Review MP4 missing or unexpectedly small"
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries",
               "stream=codec_type,codec_name,width,height",
               "-show_entries", "format=duration", "-of", "json", str(video)],
              check=True, capture_output=True, text=True
          )
          data = json.loads(probe.stdout)
          streams = data["streams"]
          v = next(s for s in streams if s["codec_type"] == "video")
          a = next(s for s in streams if s["codec_type"] == "audio")
          subtitles = [s for s in streams if s["codec_type"] == "subtitle"]
          duration = float(data["format"]["duration"])
          assert (v["codec_name"], v["width"], v["height"]) == ("h264", 1280, 720), v
          assert a["codec_name"] == "aac", a
          assert len(subtitles) == 2, f"Expected two selectable subtitle tracks, got {subtitles}"
          assert 419.0 <= duration <= 421.0, f"Unexpected review duration: {duration}"
          print(f"PASS: 7-minute H.264 review MP4, {duration:.2f}s, 1280x720, AAC, 2 subtitle tracks")
          print(f"File size: {video.stat().st_size:,} bytes")
          PY
      - name: Render the 18-shot procedural Blender 3D still library
        run: |
          mkdir -p build/3d-shots
          blender -b -t 2 --python tools/blender/render_character_lookdev.py -- \
            --shot-library --shots-dir build/3d-shots --width 1920 --height 1080
      - name: Validate all 18 procedural 3D shot images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          shots = sorted(Path("build/3d-shots").glob("shot-*.png"))
          assert len(shots) == 18, f"Expected 18 3D stills, found {len(shots)}"
          for path in shots:
              data = path.read_bytes()
              assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), f"Invalid PNG: {path}"
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == (1920, 1080), f"Unexpected dimensions for {path}: {width}x{height}"
              assert len(data) > 20000, f"3D shot unexpectedly small: {path}"
          print(f"PASS: {len(shots)} procedural 3D PNG shots at 1920x1080")
          PY
      - name: Render 1080p30 master candidate with normalized English dialogue
        run: |
          python tools/video-pipeline/render_episode.py \
            --output build/episode-001-master-1080p.mp4 \
            --width 1920 --height 1080 --fps 30 \
            --shot-list episodes/001-english-at-the-airport/render-shotlist-3d.json \
            --english-audio build/audio/episode-001-en.wav \
            --subtitles-en build/subtitles/episode-001-en-retimed.srt \
            --subtitles-fa build/subtitles/episode-001-fa-retimed.srt
      - name: Validate 1080p30 master candidate
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          video = Path("build/episode-001-master-1080p.mp4")
          assert video.is_file() and video.stat().st_size > 2_000_000, "1080p master candidate missing or too small"
          result = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries",
               "stream=codec_type,codec_name,width,height,r_frame_rate",
               "-show_entries", "format=duration", "-of", "json", str(video)],
              check=True, capture_output=True, text=True
          )
          data = json.loads(result.stdout)
          streams = data["streams"]
          v = next(s for s in streams if s["codec_type"] == "video")
          a = next(s for s in streams if s["codec_type"] == "audio")
          subs = [s for s in streams if s["codec_type"] == "subtitle"]
          duration = float(data["format"]["duration"])
          assert (v["codec_name"], v["width"], v["height"], v["r_frame_rate"]) == ("h264", 1920, 1080, "30/1"), v
          assert a["codec_name"] == "aac", a
          assert len(subs) == 2, f"Expected two selectable subtitle tracks, got {subs}"
          assert 419.0 <= duration <= 421.0, f"Unexpected master duration: {duration}"
          print(f"PASS: 1080p30 H.264 master candidate, {duration:.2f}s, AAC normalized dialogue, 2 subtitle tracks")
          print(f"File size: {video.stat().st_size:,} bytes")
          PY
      - name: Upload Episode 001 English audio and retimed subtitles
        uses: actions/upload-artifact@v4
        with:
          name: EnglishTale-Episode001-1080p-Master-Candidate-and-Review
          path: |
            build/audio/episode-001/en/*.wav
            build/audio/episode-001-en.wav
            build/subtitles/episode-001-en-retimed.srt
            build/subtitles/episode-001-fa-retimed.srt
            models/piper/en_GB-vctk-medium/ATTRIBUTION.txt
            build/episode-001-review-720p.mp4
            build/episode-001-master-1080p.mp4
            build/3d-shots/*.png
          if-no-files-found: error
          retention-days: 14
