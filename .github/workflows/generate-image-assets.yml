name: Generate Episode 001 images

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose a small audition batch or all scene illustrations"
        required: true
        type: choice
        options:
          - audition
          - generate-all
        default: audition

permissions:
  contents: read

jobs:
  generate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image pipeline dependencies
        run: python -m pip install --upgrade requests CairoSVG
      - name: Verify Google API secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add GEMINI_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Validate image generation plan
        run: python tools/image-pipeline/generate_images.py --dry-run
      - name: Generate audition scenes
        if: ${{ inputs.operation == 'audition' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tools/image-pipeline/generate_images.py \
            --scene 02-leo-lost \
            --scene 03-emma-reassures-leo \
            --scene 07-gate-information \
            --scene 11-ollie-recap
      - name: Generate all Episode 001 scenes
        if: ${{ inputs.operation == 'generate-all' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/image-pipeline/generate_images.py
      - name: Upload generated image previews
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: englishtale-episode-001-images-${{ inputs.operation }}
          path: build/images/episode-001/
          if-no-files-found: warn
          retention-days: 14
