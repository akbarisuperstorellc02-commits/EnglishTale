name: EnglishTale Episode Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-episode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile pipeline scripts
        run: python -m compileall -q tools
      - name: Validate Episode 001 inputs and SVG assets
        run: python tools/video-pipeline/validate_episode.py
      - name: Test voice asset validator
        run: python -m unittest tools/tts/test_validate_voice_assets.py -v
      - name: Check voice asset package readiness
        run: python tools/tts/validate_voice_assets.py
      - name: Smoke-test TTS audition selection without API calls
        run: |
          python tools/tts/generate_gemini_tts.py --dry-run --cue-ids 1,4,5,11,24,34
          python tools/tts/generate_elevenlabs_tts.py --dry-run --cue-ids 1,4,5,11,24,34
      - name: Install thumbnail renderer dependency
        run: python -m pip install -r tools/video-pipeline/requirements.txt
      - name: Render YouTube thumbnail
        run: python tools/video-pipeline/render_thumbnail.py
      - name: Validate thumbnail PNG dimensions
        run: python tools/video-pipeline/validate_thumbnail.py
      - name: Render vertical YouTube Shorts cover
        run: python tools/video-pipeline/render_shorts_cover.py
      - name: Validate vertical Shorts cover
        run: python tools/video-pipeline/validate_shorts_cover.py
      - name: Upload thumbnail previews
        uses: actions/upload-artifact@v4
        with:
          name: englishtale-episode-001-thumbnails
          path: |
            build/episode-001-thumbnail.png
            build/episode-001-shorts-cover.png
          if-no-files-found: error
